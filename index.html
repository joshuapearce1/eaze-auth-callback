<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="referrer" content="no-referrer" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; base-uri 'none'; connect-src 'none'; font-src 'none'; form-action 'none'; frame-ancestors 'none'; img-src 'none'; script-src 'sha256-BonCn/NLVbJsAsDsY7TpN+jR7lwKimmAWpyOeOa5ApA='; style-src 'unsafe-inline'"
    />
    <title>Continue to eaze</title>
    <style>
      :root {
        color-scheme: light;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }
      html {
        display: none;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #f4efe6;
        color: #211f1c;
      }
      main {
        width: min(29rem, calc(100% - 2rem));
        box-sizing: border-box;
        padding: 2rem;
        border: 1px solid rgba(33, 31, 28, 0.12);
        border-radius: 1.5rem;
        background: rgba(255, 255, 255, 0.58);
      }
      h1 {
        margin: 0 0 0.75rem;
        font: 500 2rem/1.1 Georgia, serif;
      }
      p {
        margin: 0 0 1.25rem;
        line-height: 1.55;
        color: #5f5a54;
      }
      button {
        width: 100%;
        min-height: 3rem;
        border: 0;
        border-radius: 999px;
        background: #526a57;
        color: white;
        font: 600 1rem/1 sans-serif;
        cursor: pointer;
      }
      button:disabled {
        cursor: default;
        opacity: 0.45;
      }
      small {
        display: block;
        margin-top: 1rem;
        color: #736d66;
        line-height: 1.45;
      }
    </style>
  </head>
  <body>
    <main>
      <h1 id="title">Continue to eaze</h1>
      <p id="message">Check this link, then continue securely in the eaze app.</p>
      <button id="continue" type="button" disabled>Open eaze</button>
      <small>This page handles account authentication only. It does not receive wellness information.</small>
    </main>
    <script>
      (() => {
        if (window.top !== window.self) {
          document.documentElement.remove();
          return;
        }
        document.documentElement.style.display = "block";

        const title = document.getElementById("title");
        const message = document.getElementById("message");
        const button = document.getElementById("continue");
        const allowedTypes = new Set(["email", "recovery", "email_change"]);
        const raw = location.hash.startsWith("#") ? location.hash.slice(1) : "";
        const params = new URLSearchParams(raw);
        const keys = Array.from(params.keys());
        const tokenHash = params.get("token_hash") || "";
        const type = params.get("type") || "";
        const validKeys =
          location.search === "" &&
          location.pathname === "/" &&
          keys.length === 2 &&
          keys.every((key) => key === "token_hash" || key === "type");
        const validToken = /^[A-Za-z0-9._~-]{32,512}$/.test(tokenHash);

        const fail = () => {
          title.textContent = "This link cannot be used";
          message.textContent = "Please return to eaze and request a new account email.";
          button.disabled = true;
          history.replaceState(null, "", location.pathname);
        };

        if (!validKeys || !validToken || !allowedTypes.has(type)) {
          fail();
          return;
        }

        if (type === "recovery") {
          title.textContent = "Reset your password";
          message.textContent = "Continue in eaze to choose a new password.";
        } else if (type === "email_change") {
          title.textContent = "Confirm your email change";
          message.textContent = "Continue in eaze to confirm this email address.";
        } else {
          title.textContent = "Confirm your email";
          message.textContent = "Continue in eaze to confirm your account.";
        }

        const callback = new URL("uk.co.eaze.app://auth/callback");
        callback.hash = new URLSearchParams({ token_hash: tokenHash, type }).toString();
        button.disabled = false;
        button.addEventListener(
          "click",
          () => {
            location.assign(callback.toString());
            setTimeout(() => history.replaceState(null, "", location.pathname), 750);
          },
          { once: true },
        );
      })();
    </script>
  </body>
</html>
