<!doctype html>
<html lang="en" dir="ltr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <meta name="robots" content="noindex,nofollow,noarchive">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; base-uri 'none'; connect-src 'none'; form-action 'none'; img-src 'none'; script-src 'self'; style-src 'self'">
  <title>Confirm your email — eaze</title>
  <link rel="stylesheet" href="./style.css">
  <script src="./confirm.js" defer></script>
</head>
<body>
  <main>
    <p class="brand" aria-label="eaze">eaze</p>
    <h1 id="title">Continue in eaze.</h1>
    <p id="message">Open the app to confirm your email and continue setting up your account.</p>
    <button id="open" type="button" disabled>Open eaze</button>
    <p class="note" id="help">Use the latest version of eaze on your iPhone. If this link has expired, return to the app to request a new confirmation email.</p>
    <noscript><p>Please open this email on your iPhone and tap its confirmation button, or enable JavaScript to use this page.</p></noscript>
    <a href="https://eaze.co.uk/support" rel="noreferrer">Get help</a>
  </main>
</body>
</html>
